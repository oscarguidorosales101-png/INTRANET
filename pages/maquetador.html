<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Intranet Escolar</title>
    <link rel="stylesheet" href="../pages/index.html">
    <style>
        /* Mantenemos la misma paleta de colores para consistencia */
        :root {
            --color-primario: #004aad;
            --color-secundario: #f4f6f9;
            --color-texto: #333333;
            --color-blanco: #ffffff;
            --color-borde: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Centramos el formulario en toda la pantalla */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--color-secundario);
            color: var(--color-texto);
        }

        .login-container {
            background-color: var(--color-blanco);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            text-align: center;
            color: var(--color-primario);
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Etiquetas claras para accesibilidad */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Estilos de los campos de entrada */
        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-borde);
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        /* Indicador de foco para navegación por teclado */
        input:focus,
        select:focus {
            outline: 2px solid #ffcc00;
            border-color: var(--color-primario);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--color-primario);
            color: var(--color-blanco);
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover, button:focus {
            background-color: #003380;
            outline: 2px solid #ffcc00;
        }
    </style>
</head>
<body>

    <main class="login-container">
        <h1>Intranet Escolar</h1>
        <p>Ingresa tus credenciales para acceder</p>

        <form action="index.html" method="GET">
            
            <!-- Selector de Rol basado en los requisitos del proyecto -->
            <div class="form-group">
                <label for="rol">Tipo de Usuario:</label>
                <select id="rol" name="rol" required>
                    <option value="" disabled selected>Selecciona tu rol...</option>
                    <option value="estudiante">Estudiante / Familia</option>
                    <option value="docente">Docente</option>
                    <option value="administracion">Administración</option>
                </select>
            </div>

            <div class="form-group">
                <label for="usuario">Usuario o Correo:</label>
                <input type="text" id="usuario" name="usuario" placeholder="ej. alumno@colegio.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="******" required>
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>
    </main>

<script src="../src/js/maquetrador.js"></script>






</body>
</html>
